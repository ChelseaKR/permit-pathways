[project]
name = "permit-pathways"
version = "0.0.1"
description = "Citation-grounded housing-permit pathway guidance for California jurisdictions, with a verification harness for currency."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Chelsea Kelly-Reif" }]
dependencies = []

[project.optional-dependencies]
# The optional runtime AI service (ADR 0004). The deterministic core stays
# dependency-free; nothing outside `permit_pathways.ai` imports these.
ai = [
  "anthropic[bedrock]>=0.125",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mangum>=0.19",
  "pypdf>=6",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "bandit>=1.8",
  "mypy>=1.18",
  "pip-audit>=2.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.15",
]

[project.urls]
Homepage = "https://github.com/ChelseaKR/permit-bearings"
Documentation = "https://github.com/ChelseaKR/permit-bearings/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/permit_pathways"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "C90", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/permit_pathways/harness/watch.py" = ["S310"]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
# `demo/app.py` is the third runtime and five scripts write committed data or
# reach the network; leaving them out made "strict mypy" describe `src` while
# reading as describing the repository.
files = ["src", "scripts", "demo"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = """
-ra \
--strict-markers \
--strict-config \
--import-mode=importlib \
--cov=permit_pathways \
--cov-branch \
--cov-report=term-missing \
--cov-fail-under=85
"""

[tool.coverage.run]
source = ["permit_pathways"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
