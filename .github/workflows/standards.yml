name: Standards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: standards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned private standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChelseaKR/portfolio-standards
          # portfolio-standards PR #97 merged on 2026-09-06 as 553909b, which
          # is this pin: the squash commit on that repository's default branch
          # carrying the applicability key rename for this repo's GitHub
          # rename. The previous pin, 9ef3ba1, was an intermediate commit on
          # PR #97's head branch; once that branch is deleted the commit
          # becomes unreachable and this required check fails on an unchanged
          # repository, so a merged commit is pinned instead.
          #
          # Still a commit rather than a released tag: the newest tag, v2.0.0,
          # predates the rename and keys this repository as `permit-pathways`,
          # which the checker resolves by checkout basename. Pinning to it
          # would fall to the `restricted` publication default and fail. Re-pin
          # to a tag once one is cut after 553909b; see issue #74.
          ref: 553909b463b7cf22569d7c56ce83a3e05d40a155
          ssh-key: ${{ secrets.STANDARDS_DEPLOY_KEY }}
          path: .standards
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check standards freshness
        run: python3 .standards/automation/check_staleness.py --standards-dir .standards

      - name: Check standards version pins
        run: python3 .standards/automation/check_versions.py --standards-dir .standards

      - name: Check repository conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .standards/automation/conformance_check.py
          --repo .
          --strict
          --network
