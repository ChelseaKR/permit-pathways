name: Source currency watch
on:
  schedule:
    - cron: "0 15 * * 1"  # Mondays 15:00 UTC (~8am Pacific)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Re-fetch watched sources and diff hashes
        id: watch
        run: |
          set +e
          set -o pipefail
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PYTHONPATH=src python -m permit_pathways.harness --fetch \
            --snapshot-out source-state-proposed.json \
            --snapshot-id "source-watch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --checked-at "$checked_at" \
            --receipt-method github_actions_source_currency_watch \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --commit-sha "$GITHUB_SHA" | tee report.txt
          watch_exit="$?"
          has_changed_sources="$(
            python -c \
              'import json; from pathlib import Path; payload = json.loads(Path("source-state-proposed.json").read_text(encoding="utf-8")); changed = payload.get("changed_source_ids"); print("true" if isinstance(changed, list) and changed else "false")' \
              2>/dev/null || printf 'false'
          )"
          echo "exit_code=$watch_exit" >> "$GITHUB_OUTPUT"
          echo "has_changed_sources=$has_changed_sources" >> "$GITHUB_OUTPUT"
      - name: Build the exact re-verification review package
        if: steps.watch.outputs.has_changed_sources == 'true'
        run: |
          set +e
          PYTHONPATH=src python -m permit_pathways.review_queue_cli \
            --source-state source-state-proposed.json \
            --out source-review-worklist.json \
            --decisions-template-out source-review-decisions-template.json
          queue_exit="$?"
          set -e
          case "$queue_exit" in
            0|1)
              test -s source-review-worklist.json
              test -s source-review-decisions-template.json
              echo "review package generated (queue exit $queue_exit)"
              ;;
            *) exit "$queue_exit" ;;
          esac
      - name: Retain the exact re-verification review package
        if: steps.watch.outputs.has_changed_sources == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-review-package
          path: |
            source-state-proposed.json
            source-review-worklist.json
            source-review-decisions-template.json
          if-no-files-found: error
          retention-days: 30
      # Exit 1 means a source was fetched and its content hash moved, a rule
      # aged out, or a golden case regressed. Exit 2 means only that some
      # sources could not be downloaded — never escalated as a change.
      #
      # The title is stable and carries no run date. A dated title guarantees
      # a distinct title every week, which is what turned one unresolved
      # condition into an unbounded pile of issues (#63 and #65 were two
      # weeks of the same one). The date, the run link, and which of the
      # three conditions fired all go in the body instead. See issue #70.
      - name: Open or update the currency review issue
        if: ${{ always() && steps.watch.outputs.exit_code == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Source currency review needed
        run: |
          set -euo pipefail
          # A changed source hash, an aged-out rule, and a golden regression
          # have different owners and different urgency. The harness prints
          # the counts so this does not have to parse prose.
          signals="$(sed -n 's/^currency signals: //p' report.txt | tail -1)"
          changed_sources="$(printf '%s' "$signals" | tr ' ' '\n' | sed -n 's/^changed_sources=//p')"
          stale_rules="$(printf '%s' "$signals" | tr ' ' '\n' | sed -n 's/^stale_rules=//p')"
          golden_regressions="$(printf '%s' "$signals" | tr ' ' '\n' | sed -n 's/^golden_regressions=//p')"
          # A signal value is either absent — an older harness, or a run that
          # died before printing, handled by the "no signal breakdown"
          # fallback below — or a count. Anything else is a value this parser
          # does not understand, such as the `not_checked` a run that did no
          # fetching prints for the two counts only a download can answer.
          # `[ "$v" != "0" ]` would read that word as "this condition fired"
          # and put it where the body promises a number, so refuse it loudly
          # instead of reporting a sentence built on a token.
          for signal_value in "$changed_sources" "$stale_rules" "$golden_regressions"; do
            case "$signal_value" in
              "") : ;;
              *[!0-9]*)
                echo "::error title=Unparseable currency signal::currency signals carried a non-numeric value: '$signal_value'" >&2
                exit 1
                ;;
            esac
          done
          # Explicit `if` rather than `[ ... ] && assign`, so `set -e` has
          # nothing subtle to do when a condition did not fire.
          fired=""
          if [ "${changed_sources:-0}" != "0" ]; then
            fired="${fired}- ${changed_sources} watched source(s) were fetched and their content hash moved. Dependent rules are stale until re-verified against the new text."$'\n'
          fi
          if [ "${stale_rules:-0}" != "0" ]; then
            fired="${fired}- ${stale_rules} rule(s) aged out of the review window. This needs a human re-verification, not a data refresh."$'\n'
          fi
          if [ "${golden_regressions:-0}" != "0" ]; then
            fired="${fired}- ${golden_regressions} golden case(s) regressed. Matching output changed."$'\n'
          fi
          if [ -z "$fired" ]; then
            fired="- The harness reported review needed without a signal breakdown."$'\n'
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf 'Run %s, %s.\n\nWhat fired:\n\n%s\n```\n%s\n```' \
            "$run_url" "$(date -u +%F)" "$fired" "$(cat report.txt)")"
          # The label makes the whole class findable and survives a title
          # edit. Creating it must never fail a run that is already reporting
          # a real problem.
          gh label create currency \
            --color B60205 \
            --description "Opened by the weekly source currency watch" \
            >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --limit 1 --label currency \
            --search "\"$TITLE\" in:title" \
            --json number,createdAt --jq '.[0] | select(.) | "\(.number) \(.createdAt)"')"
          if [ -n "$existing" ]; then
            number="${existing%% *}"
            opened="${existing##* }"
            # Filing on the first Monday of drift is right; saying nothing new
            # on the fourth is how the pile stops being read. Say how long.
            days="$(( ( $(date -u +%s) - $(date -u -d "$opened" +%s 2>/dev/null || printf '%s' "$(date -u +%s)") ) / 86400 ))"
            gh issue comment "$number" \
              --body "$(printf 'Still open after %s day(s).\n\n%s' "$days" "$body")"
            echo "commented on existing currency issue #$number"
          else
            gh issue create --title "$TITLE" --label currency --body "$body"
          fi
      - name: Note sources that could not be re-fetched
        if: steps.watch.outputs.exit_code == '2'
        run: |
          echo "::warning title=Watched sources unverifiable::One or more watched sources could not be downloaded this run. Recorded hashes and last verification dates stand; no rule was marked stale. See the run summary."
      - name: Publish the currency report to the run summary
        if: always()
        run: |
          [ -f report.txt ] || exit 0
          {
            echo "### Source currency check"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the proposed source-state receipt for human review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-state-proposed
          path: source-state-proposed.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check HCD HAU letters dashboard for new letters
        id: letters
        run: |
          set +e
          set -o pipefail
          python scripts/pull_hau_letters.py --check | tee letters.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      # Exit 3 means the dashboard was read and its rows moved. Exit 2 means
      # the dashboard could not be read at all, which is evidence about the
      # network and never a reason to report a change.
      - name: Report drift on the one open letters issue
        if: steps.letters.outputs.exit_code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(printf 'HCD published new or changed accountability letters. Refresh with:\n\n    python3 scripts/pull_hau_letters.py\n    python3 scripts/build_hcd_letters.py <today>\n\n```\n%s\n```\n\nRun: %s' \
            "$(cat letters.txt)" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          # The dashboard stays drifted until someone refreshes the dataset,
          # so every run after the first would otherwise open another issue
          # for the same unresolved condition. Update the open one instead.
          gh label create currency \
            --color B60205 \
            --description "Opened by the weekly source currency watch" \
            >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --limit 1 \
            --search 'HCD HAU letters dataset drifted in:title' \
            --json number,createdAt --jq '.[0] | select(.) | "\(.number) \(.createdAt)"')"
          if [ -n "$existing" ]; then
            number="${existing%% *}"
            opened="${existing##* }"
            days="$(( ( $(date -u +%s) - $(date -u -d "$opened" +%s 2>/dev/null || printf '%s' "$(date -u +%s)") ) / 86400 ))"
            gh issue comment "$number" \
              --body "$(printf 'Still drifted after %s day(s), as of %s.\n\n%s' "$days" "$(date -u +%F)" "$body")"
            echo "commented on existing issue #$number"
          else
            # No run date in the title: the dataset stays drifted until a
            # person refreshes it, and a dated title makes each week look
            # like a separate problem.
            gh issue create \
              --title "HCD HAU letters dataset drifted" \
              --label currency \
              --body "$body"
          fi
      # An alert channel that only ever opens issues is an append-only log.
      # Nothing records that a condition cleared, so a maintainer cannot tell
      # a resolved alert from one nobody looked at. A green run closes what it
      # opened, with a comment saying which run cleared it.
      #
      # Exit 2 deliberately does not appear here. A source that could not be
      # downloaded is evidence about the network: it must not open an alert,
      # and it must not close one either, because nothing was learned about
      # the law in that run.
      - name: Close currency alerts that have cleared
        if: ${{ always() && (steps.watch.outputs.exit_code == '0' || steps.letters.outputs.exit_code == '0') }}
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_EXIT: ${{ steps.watch.outputs.exit_code }}
          LETTERS_EXIT: ${{ steps.letters.outputs.exit_code }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # $3 is an optional `--label` filter. The currency alert carries the
          # label from the day it is opened, so its close can require it and
          # never touch a human-filed issue that shares the heading. The
          # letters alert predates the label (#63 and #65 were filed with
          # dated titles and none), so its close matches on title alone and
          # can clear that backlog.
          close_cleared() {
            title="$1"
            cleared="$2"
            gh issue list --state open --limit 20 ${3:-} \
              --search "\"$title\" in:title" --json number --jq '.[].number' \
            | while read -r number; do
                [ -n "$number" ] || continue
                gh issue comment "$number" \
                  --body "$(printf 'Cleared on %s. %s\n\nRun: %s' \
                    "$(date -u +%F)" "$cleared" "$run_url")"
                gh issue close "$number" --reason completed
                echo "closed #$number"
              done
          }
          if [ "${WATCH_EXIT:-}" = "0" ]; then
            close_cleared "Source currency review needed" \
              "No watched source changed, no rule aged out, and no golden case regressed." \
              "--label currency"
          fi
          if [ "${LETTERS_EXIT:-}" = "0" ]; then
            close_cleared "HCD HAU letters dataset drifted" \
              "The committed dataset matches the dashboard again."
          fi
          # The label keeps the class findable after a title edit.
          gh label create currency \
            --color B60205 \
            --description "Opened by the weekly source currency watch" \
            >/dev/null 2>&1 || true

      - name: Note that the letters dashboard could not be read
        if: steps.letters.outputs.exit_code == '2'
        run: |
          echo "::warning title=HCD letters dashboard unverifiable::The HAU letters dashboard could not be read this run. The committed dataset stands and no drift is reported. See the run summary."
      - name: Publish the letters check to the run summary
        if: always()
        run: |
          [ -f letters.txt ] || exit 0
          {
            echo "### HCD HAU letters check"
            echo
            echo '```'
            cat letters.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
